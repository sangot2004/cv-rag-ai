workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: "$CI_COMMIT_BRANCH"

default:
  tags: [saas-linux-small-amd64]
  interruptible: true
  timeout: 30m

stages: [verify, browser]

variables:
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
  NEXT_TELEMETRY_DISABLED: "1"

backend-tests:
  stage: verify
  image: python:3.12-slim-bookworm
  variables:
    PYTHONPATH: "$CI_PROJECT_DIR"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential libgomp1
    - python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
    - python -m pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -q --junitxml=reports/backend.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/backend.xml
    paths: [reports/backend.xml]

.frontend-job:
  image: node:22-bookworm
  cache:
    key:
      prefix: npm-node22
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

frontend-checks:
  extends: .frontend-job
  stage: verify
  script:
    - npm run lint
    - npm run typecheck
    - npm run build

browser-tests:
  extends: .frontend-job
  stage: browser
  needs: [frontend-checks]
  variables:
    PLAYWRIGHT_CHANNEL: chromium
    PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml
  script:
    - npx playwright install --with-deps chromium
    - npm run test:e2e -- --forbid-only --reporter=line,junit
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: frontend/test-results/junit.xml
    paths: [frontend/test-results/]

compose-check:
  stage: verify
  image: docker:27-cli
  variables:
    APP_ENV_FILE: .env.example
  script:
    - docker compose --env-file .env.example config --quiet
    - docker compose --env-file .env.example --profile demo config --quiet
    - docker compose --env-file .env.example --profile demo --profile scheduler config --quiet
